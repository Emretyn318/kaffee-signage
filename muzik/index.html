<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1c1410">
<title>Kaffee Schütz · Müzik</title>
<style>
:root{--bg:#1c1410;--fg:#f4ece4;--mute:#a8998c;--acc:#c8a27a;--on:#5fb37a;--off:#d9822b}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
.brand{letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--mute)}
h1{margin:0;font-size:22px;font-weight:600}
.now{font-size:26px;font-weight:700;max-width:640px}
.art{color:var(--mute);margin-top:-12px}
.btn{appearance:none;border:0;border-radius:999px;padding:18px 34px;font-size:18px;font-weight:700;background:var(--acc);color:#1c1410;cursor:pointer}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid #4a3a30;padding:10px 20px;font-size:14px}
.st{font-size:13px;color:var(--mute)}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--off)}.dot.on{background:var(--on)}
.bar{width:min(520px,90vw);height:4px;background:#3a2c24;border-radius:2px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0}
input{background:#2a1f19;border:1px solid #4a3a30;color:var(--fg);border-radius:8px;padding:12px;font-size:18px;letter-spacing:2px;text-transform:uppercase;width:220px;text-align:center}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <div class="brand">Kaffee Schütz · Müzik</div>
  <section id="kodu" hidden>
    <p>Bu cihazın müzik kodunu yazın (yönetim sayfasında "Müzik cihazları" altında).</p>
    <p><input id="kin" maxlength="8" autocomplete="off"> <button class="btn ghost" id="kok">Kaydet</button></p>
  </section>
  <section id="ana" hidden style="display:flex;flex-direction:column;align-items:center;gap:18px">
    <h1 id="ad">…</h1>
    <button class="btn" id="basla">Müziği başlat</button>
    <div id="calan" hidden style="display:flex;flex-direction:column;align-items:center;gap:16px">
      <div class="now" id="parca">—</div><div class="art" id="sanatci"></div>
      <div class="bar"><i id="ilerle"></i></div>
      <div class="st" id="liste"></div>
      <button class="btn ghost" id="dur">Duraklat</button>
    </div>
    <div class="st"><span class="dot" id="nok"></span><span id="durum">Bağlanıyor…</span></div>
    <div class="st" id="indir"></div>
  </section>
</main>
<audio id="a0" preload="auto"></audio><audio id="a1" preload="auto"></audio>
<script>
(function(){
  var SB_URL = 'https://qeawswbursiypqovychg.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlYXdzd2J1cnNpeXBxb3Z5Y2hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzOTU4MzgsImV4cCI6MjEwOTk3MTgzOH0.Q_IHiGWSrqM_eOaSaEBUlQLmN-E4ddBKiSKTceOPL2Q';
  var VER = 'muzik-1.0.0', CACHE = 'muzik-v1', FADE = 4000, KEEP_DAYS = 21;
  var $ = function(i){ return document.getElementById(i); };
  var ls = { get:function(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set:function(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
  var qs = new URLSearchParams(location.search);
  var CODE = (qs.get('c') || ls.get('mz_code') || '').toUpperCase();
  if (qs.get('c')) ls.set('mz_code', CODE);
  var pub = function(p){ return SB_URL + '/storage/v1/object/public/signage/' + encodeURI(p); };

  var man = null, kuyruk = [], sira = 0, imza = '', aktif = 0, calisiyor = false, duraklat = false, simdi = null, hedefSes = 0.7;
  var A = [$('a0'), $('a1')];

  if (!CODE) { $('kodu').hidden = false; $('kok').onclick = function(){ var v = $('kin').value.trim().toUpperCase(); if (v) { ls.set('mz_code', v); location.search = '?c=' + v; } }; return; }
  $('ana').hidden = false;

  function durum(t, on){ $('durum').textContent = t; $('nok').className = 'dot' + (on ? ' on' : ''); }
  function karistir(a){ a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

  // ---- önbellek: parçalar cihaza bir kez iner, sonra internetsiz çalar ----
  var hasCache = !!(window.caches && window.isSecureContext !== false);
  var gorulen = {}; try { gorulen = JSON.parse(ls.get('mz_seen') || '{}'); } catch(e){}
  function isaretle(p){ gorulen[p] = Date.now(); ls.set('mz_seen', JSON.stringify(gorulen)); }
  function kaynak(it){
    var u = pub(it.path); isaretle(it.path);
    if (!hasCache) return Promise.resolve(u);
    return caches.open(CACHE).then(function(c){ return c.match(u).then(function(r){
      if (r) return r.blob().then(function(b){ return URL.createObjectURL(b); });
      return u; // henüz inmediyse ağdan çal; arka planda iner
    }); }).catch(function(){ return u; });
  }
  var indiriliyor = false;
  function onIndir(){
    if (!hasCache || indiriliyor || !man || !man.items) return;
    var t = Date.now(); man.items.forEach(function(it){ gorulen[it.path] = t; }); ls.set('mz_seen', JSON.stringify(gorulen));
    indiriliyor = true;
    caches.open(CACHE).then(function(c){
      var list = man.items.slice(), n = 0;
      function sonraki(){
        if (!list.length) { indiriliyor = false; $('indir').textContent = ''; temizle(c); return; }
        var it = list.shift(), u = pub(it.path);
        c.match(u).then(function(r){
          if (r) return sonraki();
          n++; $('indir').textContent = 'Parçalar cihaza indiriliyor… (' + list.length + ' kaldı)';
          fetch(u).then(function(res){ if (res.ok) return c.put(u, res); }).catch(function(){}).then(sonraki);
        });
      }
      sonraki();
    }).catch(function(){ indiriliyor = false; });
  }
  function temizle(c){
    var sinir = Date.now() - KEEP_DAYS * 864e5;
    c.keys().then(function(ks){ ks.forEach(function(rq){
      var p = decodeURI(rq.url.split('/object/public/signage/')[1] || '');
      if (!gorulen[p] || gorulen[p] < sinir) { c.delete(rq); delete gorulen[p]; }
    }); ls.set('mz_seen', JSON.stringify(gorulen)); });
  }

  // ---- manifest ----
  function manifestAl(){
    var x = new XMLHttpRequest();
    x.open('POST', SB_URL + '/rest/v1/rpc/music_manifest');
    x.setRequestHeader('apikey', SB_KEY); x.setRequestHeader('Authorization', 'Bearer ' + SB_KEY); x.setRequestHeader('Content-Type', 'application/json');
    x.timeout = 15000;
    x.onload = function(){ try { var m = JSON.parse(x.responseText); if (m.error) { durum(m.error === 'unknown_player' ? 'Bu kod tanımlı değil. Yöneticiye sorun.' : m.error, false); return; } ls.set('mz_man', JSON.stringify(m)); uygula(m, true); } catch(e){ durum('Sunucu yanıtı okunamadı', false); } };
    x.onerror = x.ontimeout = function(){ durum('İnternet yok, cihazdaki parçalar çalıyor', false); };
    x.send(JSON.stringify({ p_code: CODE, p_info: { v: VER, ua: navigator.userAgent.slice(0, 120), now: simdi ? (simdi.artist ? simdi.artist + ' – ' : '') + simdi.name : null, playing: calisiyor && !duraklat } }));
  }
  function uygula(m, cevrim){
    man = m; $('ad').textContent = m.player || 'Müzik';
    hedefSes = Math.max(0, Math.min(100, m.volume == null ? 70 : m.volume)) / 100;
    var yeni = (m.playlist || '') + '|' + (m.items || []).map(function(i){ return i.id; }).join(',');
    if (yeni !== imza) {
      imza = yeni; kuyruk = m.shuffle ? karistir(m.items || []) : (m.items || []).slice(); sira = 0;
      if (calisiyor && !kuyruk.length) sustur();
      else if (calisiyor && !A[aktif].src) sonrakiParca();
    }
    if (calisiyor && !duraklat) A[aktif].volume = hedefSes;
    $('liste').textContent = kuyruk.length ? (m.playlist || '') + (m.until ? ' · ' + m.until.slice(0,5) + '’e kadar' : '') : 'Şu an çalma saati değil';
    if (cevrim) durum('Bağlı', true);
    onIndir();
  }

  // ---- çalma ----
  function solma(el, hedef, ms, bitti){
    var bas = el.volume, t0 = Date.now();
    (function adim(){ var k = Math.min(1, (Date.now() - t0) / ms); el.volume = Math.max(0, Math.min(1, bas + (hedef - bas) * k)); if (k < 1) setTimeout(adim, 100); else if (bitti) bitti(); })();
  }
  function sustur(){ var el = A[aktif]; solma(el, 0, FADE, function(){ el.pause(); el.removeAttribute('src'); }); simdi = null; $('parca').textContent = '—'; $('sanatci').textContent = ''; }
  function sonrakiParca(){
    if (!kuyruk.length) { sustur(); return; }
    if (sira >= kuyruk.length) { sira = 0; if (man && man.shuffle) kuyruk = karistir(kuyruk); }
    var it = kuyruk[sira++], eski = A[aktif], yeniEl = A[1 - aktif];
    kaynak(it).then(function(src){
      yeniEl.src = src; yeniEl.volume = 0;
      var p = yeniEl.play();
      var basladi = function(){
        aktif = 1 - aktif; simdi = it;
        $('parca').textContent = it.name; $('sanatci').textContent = it.artist || '';
        solma(yeniEl, hedefSes, FADE);
        if (!eski.paused) solma(eski, 0, FADE, function(){ eski.pause(); if (eski.src.indexOf('blob:') === 0) URL.revokeObjectURL(eski.src); eski.removeAttribute('src'); });
      };
      if (p && p.then) p.then(basladi, function(){ setTimeout(sonrakiParca, 2000); }); else basladi();
    });
  }
  A.forEach(function(el, i){
    el.addEventListener('timeupdate', function(){
      if (i !== aktif || !el.duration) return;
      $('ilerle').style.width = (100 * el.currentTime / el.duration) + '%';
      if (!el._gecis && el.duration - el.currentTime < FADE / 1000) { el._gecis = true; sonrakiParca(); }
    });
    el.addEventListener('playing', function(){ el._gecis = false; });
    el.addEventListener('ended', function(){ if (i === aktif && !el._gecis) sonrakiParca(); });
    el.addEventListener('error', function(){ if (i === aktif && el.getAttribute('src')) setTimeout(sonrakiParca, 1500); });
  });

  var kilit = null;
  function uyanik(){ try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(function(k){ kilit = k; }).catch(function(){}); } catch(e){} }
  document.addEventListener('visibilitychange', function(){ if (document.visibilityState === 'visible' && calisiyor) uyanik(); });

  $('basla').onclick = function(){
    calisiyor = true; $('basla').hidden = true; $('calan').hidden = false; uyanik();
    // iOS/Android ses kilidini açmak için iki çalara da dokunuş anında boş çal
    A.forEach(function(el){ try { el.muted = true; var p = el.play(); if (p && p.catch) p.catch(function(){}); el.pause(); el.muted = false; } catch(e){} });
    sonrakiParca();
  };
  $('dur').onclick = function(){
    duraklat = !duraklat; var el = A[aktif];
    if (duraklat) { solma(el, 0, 800, function(){ el.pause(); }); $('dur').textContent = 'Devam et'; }
    else { el.play(); solma(el, hedefSes, 800); $('dur').textContent = 'Duraklat'; }
  };

  var eski = ls.get('mz_man'); if (eski) { try { uygula(JSON.parse(eski), false); } catch(e){} }
  manifestAl(); setInterval(manifestAl, 60000);
  // gece yarısı sayfayı tazele (bellek sızıntısı ve yeni sürüm için)
  setInterval(function(){ var d = new Date(); if (d.getHours() === 4 && d.getMinutes() === 0 && !kuyruk.length) location.reload(); }, 60000);
})();
</script>
</body>
</html>
