<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kaffee Schütz Player</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;background:#000;overflow:hidden;cursor:none;font-family:sans-serif}
  .layer{position:absolute;top:0;left:0;width:100%;height:100%;opacity:0;transition:opacity .8s ease}
  .layer.on{opacity:1}
  .layer img,.layer video{width:100%;height:100%;object-fit:contain;display:block;background:#000}
  body.cover .layer img,body.cover .layer video{object-fit:cover}
  #msg{position:absolute;left:0;right:0;top:40%;text-align:center;color:#c8a46a;font-size:3vmin;display:none}
  #stage{position:absolute;top:0;left:0;width:100%;height:100%;overflow:hidden}
  body.r90 #stage{width:100vh;height:100vw;transform-origin:top left;transform:rotate(90deg) translateY(-100%)}
  body.r270 #stage{width:100vh;height:100vw;transform-origin:top left;transform:rotate(270deg) translateX(-100%)}
  #setup{position:absolute;top:0;left:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;flex-direction:column;color:#efe4d2;background:#3a2419;text-align:center;font-family:Georgia,serif}
  #setup .t{font-size:4vmin;margin-bottom:3vmin}
  #setup .c{font-size:16vmin;letter-spacing:2vmin;color:#fff;font-family:sans-serif;font-weight:700}
  #setup .h{font-size:2.4vmin;color:#cdbba6;margin-top:3vmin;max-width:70vmin;font-family:sans-serif;line-height:1.5}
  #dbg{position:absolute;right:1vmin;bottom:1vmin;color:#666;font-size:1.4vmin;display:none}
</style>
</head>
<body>
<div id="stage">
<div id="a" class="layer"></div>
<div id="b" class="layer"></div>
<div id="msg"></div>
<div id="setup">
  <div class="t">Kaffee Schütz ekran eşleştirme</div>
  <div class="c" id="pairCode">······</div>
  <div class="h">Yönetim panelinde bu ekranı açıp "Ekranı eşleştir" alanına yukarıdaki kodu girin. Eşleşince yayın kendiliğinden başlar.</div>
</div>
</div>
<div id="dbg"></div>
<script>
(function(){
  var VERSION = '1.3.0';
  var SB_URL = 'https://qeawswbursiypqovychg.supabase.co';
  var SB_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InFlYXdzd2J1cnNpeXBxb3Z5Y2hnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQzOTU4MzgsImV4cCI6MjEwOTk3MTgzOH0.Q_IHiGWSrqM_eOaSaEBUlQLmN-E4ddBKiSKTceOPL2Q';
  var POLL_MS = 60000;

  function qs(k){ var m = new RegExp('[?&]'+k+'=([^&]*)').exec(location.search); return m ? decodeURIComponent(m[1]) : null; }
  function store(k,v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k,v);}catch(e){ return null; } }

  var PREVIEW = !!qs('preview');   // önizleme: ekranı çevrimiçi göstermez, kodu kaydetmez
  var code = qs('code') || store('sig_code');
  if (qs('code') && !PREVIEW) store('sig_code', qs('code'));
  var cls = [];
  if (qs('fit') === 'cover') cls.push('cover');
  var rot = qs('rotate') || store('sig_rotate');
  if (qs('rotate') && !PREVIEW) store('sig_rotate', qs('rotate'));
  if (rot === '90' || rot === '270') cls.push('r' + rot);
  document.body.className = cls.join(' ');
  // internet yokken de açılabilmesi için sayfanın kendisini cihazda sakla
  if ('serviceWorker' in navigator && !PREVIEW) { try { navigator.serviceWorker.register('sw.js'); } catch(e){} }
  if (qs('debug')) document.getElementById('dbg').style.display = 'block';

  var items = [], sig = '', idx = -1, timer = null, cur = 'a';
  var msgEl = document.getElementById('msg');
  function msg(t){ msgEl.textContent = t || ''; msgEl.style.display = t ? 'block' : 'none'; }
  function dbg(t){ document.getElementById('dbg').textContent = 'v'+VERSION+' · '+code+' · '+t; }
  function pub(path){ return SB_URL + '/storage/v1/object/public/signage/' + encodeURI(path); }

  function rpc(fn, body, ok, fail){
    var xhr = new XMLHttpRequest();
    xhr.open('POST', SB_URL + '/rest/v1/rpc/' + fn);
    xhr.setRequestHeader('apikey', SB_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SB_KEY);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 20000;
    xhr.onload = function(){ if (xhr.status === 200) { try { ok(JSON.parse(xhr.responseText), xhr.responseText); } catch(e){ fail && fail('parse'); } } else fail && fail('http ' + xhr.status); };
    xhr.onerror = xhr.ontimeout = function(){ fail && fail('offline'); };
    xhr.send(JSON.stringify(body));
  }

  // Kod yoksa: eşleştirme ekranı. Ekran 6 haneli bir kod gösterir, panelden bu ekrana atanınca kodunu alır.
  if (!code) {
    var pair = store('sig_pair');
    if (!pair) { pair = String(100000 + Math.floor(Math.random() * 900000)); store('sig_pair', pair); }
    document.getElementById('setup').style.display = 'flex';
    document.getElementById('pairCode').textContent = pair;
    var poll = function(){
      rpc('signage_pair', { p_pair: pair }, function(r){
        if (r.status === 'paired' && r.code) { store('sig_code', r.code); try { localStorage.removeItem('sig_pair'); } catch(e){} location.reload(); }
      });
    };
    poll(); setInterval(poll, 5000);
    setInterval(function(){ try { if (window.parent !== window) window.parent.postMessage('sig-alive', '*'); } catch(e){} }, 15000);
    return;
  }

  function fetchManifest(){
    var xhr = new XMLHttpRequest();
    xhr.open('POST', SB_URL + '/rest/v1/rpc/' + (PREVIEW ? 'signage_preview' : 'signage_manifest'));
    xhr.setRequestHeader('apikey', SB_KEY);
    xhr.setRequestHeader('Authorization', 'Bearer ' + SB_KEY);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.timeout = 20000;
    xhr.onload = function(){
      if (xhr.status !== 200) { dbg('http ' + xhr.status); return; }
      try { var m = JSON.parse(xhr.responseText); if (!PREVIEW) store('sig_manifest', xhr.responseText); apply(m); } catch(e){ dbg('parse'); }
    };
    xhr.onerror = xhr.ontimeout = function(){ dbg('offline, cache'); };
    xhr.send(JSON.stringify(PREVIEW ? { p_code: code } : { p_code: code, p_info: { v: VERSION, ua: navigator.userAgent, w: screen.width, h: screen.height } }));
  }

  // ---- Yerel hafıza (Cache Storage): her dosya bir kez indirilir, sonra cihazdan oynar ----
  // Not: hafızadaki dosyalar otomatik silinmez.
  var CACHE = 'sig-media-v1';
  var hasCache = !!(window.caches && window.isSecureContext !== false);
  var blobUrls = {};   // remote url -> object url

  function localUrl(remote){
    if (!hasCache) return Promise.resolve(remote);
    if (blobUrls[remote]) return Promise.resolve(blobUrls[remote]);
    return caches.open(CACHE).then(function(c){
      return c.match(remote).then(function(hit){
        if (hit) return hit;
        return fetch(remote, { mode: 'cors' }).then(function(r){
          if (!r.ok) throw new Error('http ' + r.status);
          return c.put(remote, r.clone()).then(function(){ return r; }, function(){ return r; });
        });
      });
    }).then(function(r){ return r.blob(); }).then(function(b){
      var u = URL.createObjectURL(b); blobUrls[remote] = u; return u;
    }).catch(function(){ return remote; });  // hata olursa doğrudan internetten oynat
  }


  var applySeq = 0;
  function apply(m){
    if (m.error === 'unknown_screen') {
      if (!PREVIEW && !qs('code')) { try { localStorage.removeItem('sig_code'); localStorage.removeItem('sig_manifest'); } catch(e){} location.reload(); return; }
      msg('Tanımsız ekran kodu: ' + code); items = []; return;
    }
    if (!qs('rotate') && m.rotate !== undefined) {   // döndürme panelden ayarlanır
      var b = document.body.className.replace(/\s*r(90|270)/g, '');
      document.body.className = b + ((m.rotate === 90 || m.rotate === 270) ? ' r' + m.rotate : '');
    }
    var list = (m.items || []).map(function(i){ return { remote: pub(i.path), kind: i.kind, duration: Math.max(3, i.duration || 10) }; });
    var newSig = JSON.stringify(list);
    dbg((m.schedule || 'zamanlama yok') + ' · ' + list.length + ' öğe');
    if (newSig === sig) return;
    sig = newSig;
    var seq = ++applySeq;
    if (!list.length) { items = []; msg(''); return; }
    if (!items.length) msg('Yükleniyor…');
    // dosyaları sırayla hazırla (aynı anda hepsini indirip bağlantıyı boğmamak için)
    var p = Promise.resolve();
    list.forEach(function(i){ p = p.then(function(){ return localUrl(i.remote).then(function(u){ i.url = u; }); }); });
    p.then(function(){
      if (seq !== applySeq) return;   // bu arada yeni liste geldiyse bırak
      items = list; msg('');
      if (timer) clearTimeout(timer);
      idx = -1; next();
      dbg((m.schedule || 'zamanlama yok') + ' · ' + list.length + ' öğe · ' + (hasCache ? 'yerel' : 'online'));
    });
  }

  function next(){
    if (!items.length) return;
    idx = (idx + 1) % items.length;
    var it = items[idx];
    var nxt = cur === 'a' ? 'b' : 'a';
    var el = document.getElementById(nxt), old = document.getElementById(cur);
    el.innerHTML = '';
    if (it.kind === 'video') {
      var v = document.createElement('video');
      v.src = it.url; v.muted = true; v.autoplay = true; v.playsInline = true;
      v.setAttribute('muted',''); v.setAttribute('playsinline','');
      if (items.length === 1) v.loop = true;
      v.onended = function(){ next(); };
      v.onerror = function(){ timer = setTimeout(next, 1000); };
      el.appendChild(v);
      var p = v.play(); if (p && p.catch) p.catch(function(){});
      timer = setTimeout(next, 10 * 60 * 1000); // emniyet
    } else {
      var img = document.createElement('img');
      img.src = it.url;
      el.appendChild(img);
      if (items.length > 1) timer = setTimeout(next, it.duration * 1000);
    }
    el.className = 'layer on';
    old.className = 'layer';
    setTimeout(function(){ if (old.className === 'layer') old.innerHTML = ''; }, 1000);
    cur = nxt;
  }
  var _next = next;
  next = function(){ if (timer) { clearTimeout(timer); timer = null; } _next(); };

  var cached = PREVIEW ? null : store('sig_manifest');
  if (cached) { try { apply(JSON.parse(cached)); } catch(e){} } else { msg('Yükleniyor…'); }
  fetchManifest();
  setInterval(fetchManifest, POLL_MS);
  // Samsung uygulaması içinde çalışıyorsa "açıldım" sinyali ver (uygulama takılırsa yeniden yükler)
  setInterval(function(){ try { if (window.parent !== window) window.parent.postMessage('sig-alive', '*'); } catch(e){} }, 15000);
  try { if (window.parent !== window) window.parent.postMessage('sig-alive', '*'); } catch(e){}
  // günlük yenileme (bellek sızıntılarına karşı)
  setTimeout(function(){ location.reload(); }, 24 * 3600 * 1000);
})();
</script>
</body>
</html>
