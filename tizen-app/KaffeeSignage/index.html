<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>KaffeeSignage</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden;cursor:none}
  iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;background:#000}
  #wait{position:absolute;inset:0;display:none;align-items:center;justify-content:center;color:#cdbba6;font:3vmin sans-serif;background:#3a2419}
</style>
</head>
<body>
<iframe id="f" allow="autoplay; fullscreen" src="about:blank"></iframe>
<div id="wait">Bağlantı bekleniyor…</div>
<script>
// Kaffee Schütz ekran uygulaması: oynatıcıyı tam ekran açar, takılırsa kendini toparlar.
(function () {
  var PLAYER = 'https://emretyn318.github.io/kaffee-signage/player/';
  var f = document.getElementById('f'), wait = document.getElementById('wait');
  var lastAlive = 0;

  function load() { f.src = PLAYER + '?t=' + Date.now(); }

  window.addEventListener('message', function (e) {
    if (e.data === 'sig-alive') { lastAlive = Date.now(); wait.style.display = 'none'; }
  });

  // 45 sn içinde oynatıcıdan ses gelmezse (açılamadıysa ya da donduysa) yeniden yükle
  setInterval(function () {
    if (Date.now() - lastAlive > 45000) { wait.style.display = lastAlive ? 'none' : 'flex'; load(); }
  }, 45000);

  // Ekranın uykuya geçmesini engelle (destekleyen cihazlarda)
  try { if (window.webapis && webapis.appcommon) webapis.appcommon.setScreenSaver(webapis.appcommon.AppCommonScreenSaverState.SCREEN_SAVER_OFF); } catch (e) {}

  // Kumandada Geri tuşu uygulamayı kapatmasın
  document.addEventListener('keydown', function (e) { if (e.keyCode === 10009) e.preventDefault(); });

  load();
})();
</script>
</body>
</html>
